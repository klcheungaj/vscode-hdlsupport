begin:
  prefix: begin
  description: begin-end block
  body:
    - begin
    - "\t$0"
    - end

always:
  prefix: always
  description: always block
  body: 
    - always @(${1:sensitivity_list}) begin
    - "\t$0"
    - end

always_ff:
  prefix: always_ff
  description: always_ff block
  body:
    - always_ff @(posedge ${1:clock} or negedge ${2:arstn}) begin
    - "\t$0"
    - end

always_latch:
  prefix: always_latch
  description: always_latch block
  body:
    - always_latch begin
    - "\t$0"
    - end

always_comb:
  prefix: always_comb
  description: always_comb block
  body:
    - always_comb begin
    - "\t$0"
    - end

if:
  prefix: if
  description: if statement
  body: 
    - if (${1:condition}) begin
    - "\t$0"
    - end

else:
  prefix: else
  description: else block
  body: 
    - else begin
    - "\t$0"
    - end

ifelse:
  prefix: if else
  description: if-else statement
  body:
    - if (${1:condition}) begin
    - "\t$2"
    - "end else begin"
    - "\t$0"
    - end
  
elseif:
  prefix: else if
  description: else-if statement
  body: 
    - else if (${1:condition}) begin
    - "\t$0"
    - end

case:
  prefix: case
  description: case statement
  body:
    - case (${1:var})
    - "\t$0"
    - "endcase"
  
while:
  prefix: while
  description: while statement
  body:
    - while (${1:expression}) begin
    - "\t$0"
    - "end"
    
for:
  prefix: for
  description: for statement
  body:
    - for (int ${1:i}=0; ${1:i}<${2:MAX}; ++${1:i}) begin
    - "\t$0"
    - "end"

foreach:
  prefix: foreach
  description: foreach statement
  body:
    - foreach (${1:arr}) begin
    - "\t$0"
    - "end"

function:
  prefix: function
  description: function definition
  body:
    - function ${1:return_type} ${2:name}(${3:port_list});
    - "\t$0"
    - "endfunction"

task:
  prefix: task
  description: task definition
  body:
    - task ${1:name}(${2:port_list});
    - "\t$0"
    - "endtask"

class:
  prefix: class
  description: class definition
  body:
    - class ${1:name};
    - "\t$0"
    - endclass

class extends:
  prefix: class extends
  description: class-extends definition
  body:
    - class ${1:name} extends ${2:super};
    - "\tfunction new();"
    - "\t\t$0"
    - "\tendfunction"
    - endclass

program:
  prefix: program
  description: program definition
  body:
    - program ${1:name}(${2:port_list});
    - "\t$0"
    - endprogram

module:
  prefix: module
  description: module definition
  body:
    - module ${1:name} (
    - "\t${2:port_list}"
    - );
    - 
    - "\t$0"
    - 
    - endmodule

module#(param):
  prefix: "module #("
  description: parameterized module definition
  body:
    - "module ${1:name} #("
    - "\t${2:parameters}"
    - ") ("
    - "\t${3:port_list}"
    - );
    - 
    - "\t$0"
    - 
    - endmodule

assert: 
  prefix: assert
  description: immediate assertion statement
  body: 
    - "${1:label}: assert (${2:test})"
    - "\telse \\$error(\"${0:Assertion ${1:label} failed!}\");"

property:
  prefix: property
  description: property statement
  body: 
    - property ${1:name};
    - "\t@(posedge ${2:clk}) ${0:test}"
    - endproperty

generate:
  prefix: generate
  description: generate block
  body:
    - generate
    - "\t$0"
    - endgenerate

typedef struct:
  prefix: typedef struct
  description: typedef structure definition
  body: 
    - typedef struct packed {
    - "\t$0"
    - "} ${1: name};" 

typedef enum:
  prefix: typedef enum
  description: typedef enumeration definition
  body: 
    - typedef enum ${1:type} {
    - "\t$0"
    - "} ${2: name};" 

interface:
  prefix: interface
  description: interface definition
  body: 
    - interface ${1:name};
    - "\t$0"
    - endinterface

separator:
  prefix: separator
  description: a separator
  body:
    - "// -------------------------------------------------------\n$0"

heading:
  prefix: heading
  description: a heading
  body:
    - // -------------------------------------------------------
    - // -- ${1:heading}
    - "// -------------------------------------------------------\n$0"

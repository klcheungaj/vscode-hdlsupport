# VHDL TextMate grammar.
#
# A flat lexical grammar: single-line match rules for declarations, labels
# and library names, plus the reserved words and the std/ieee package word
# lists. Nothing spans constructs, so an unfinished statement cannot change
# the colors of the rest of the file. Scope names follow the grammar by
# Rich J. Young (2019) that this replaces. Every rule is case-insensitive.
scopeName: source.vhdl
name: VHDL
patterns:
  - include: '#comments'
  - include: '#literals'
  - include: '#declarations'
  - include: '#associations'
  - include: '#reserved'
  - include: '#library'
  - include: '#identifiers'
  - include: '#delimiters'
repository:
  comments:
    patterns:
      - match: --.*$
        name: comment.line.vhdl
      - begin: /\*
        end: \*/
        name: comment.block.vhdl

  literals:
    patterns:
      - match: (?i)\b\d[\d_]*#[0-9a-f_]+(?:\.[0-9a-f_]+)?#(?:e[+-]?\d[\d_]*)?
        name: constant.numeric.based_literal.vhdl
      - match: (?i)\b(?:\d+)?(?:[us]?[box]|d)"[^"]*"
        name: constant.numeric.bit_string_literal.vhdl
      - match: (?i)\b\d[\d_]*(?:\.\d[\d_]*)?(?:e[+-]?\d[\d_]*)?
        name: constant.numeric.decimal_literal.vhdl
      - match: '"(?:""|[^"])*"'
        name: string.quoted.double.vhdl
      # A character literal, not the tick of an attribute or qualifier.
      - match: (?<![\w)\]])'.'
        name: string.quoted.single.vhdl
      # `type_mark'(expr)` qualified expressions and `name'attribute`.
      - match: (?i)\b([a-z]\w*)(')(?=\()
        captures:
          '1': { name: entity.name.type.vhdl }
          '2': { name: keyword.operator.vhdl }
      - match: (?i)(?<=[\w)\]])(')([a-z]\w*)
        captures:
          '1': { name: keyword.operator.vhdl }
          '2': { name: variable.annotation.vhdl }

  declarations:
    patterns:
      - match: (?i)\b(library)\s+([a-z]\w*(?:\s*,\s*[a-z]\w*)*)
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: entity.name.section.vhdl }
      - match: (?i)\b(use|context)\s+((?:[a-z]\w*\s*\.\s*)+)(?:(all)\b|([a-z]\w*))
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: entity.name.section.vhdl }
          '3': { name: keyword.reserved.vhdl }
          '4': { name: entity.name.type.vhdl }
      - match: (?i)\b(architecture|configuration)\s+([a-z]\w*)\s+(of)\s+([a-z]\w*)
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: entity.name.type.vhdl }
          '3': { name: keyword.reserved.vhdl }
          '4': { name: entity.other.inherited-class.vhdl }
      - match: (?i)\b(entity|context|package(?:\s+body)?|component)\s+([a-z]\w*)(?=\s+is\b|\s*$)
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: entity.name.type.vhdl }
      - match: (?i)\b(type)\s+([a-z]\w*)
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: entity.name.type.vhdl }
      - match: (?i)\b(subtype)\s+([a-z]\w*)(?:\s+(is)\s+((?:[a-z]\w*\.)*)([a-z]\w*))?
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: entity.name.type.vhdl }
          '3': { name: keyword.reserved.vhdl }
          '4': { name: entity.name.section.vhdl }
          '5': { patterns: [{ include: '#library' }, { match: '.+', name: entity.name.type.vhdl }] }
      # A non-object alias names a type or subprogram; an object alias has a
      # `: subtype` that the type-mark rule colors.
      - match: (?i)\b(alias)\s+([a-z]\w*)(?=\s+is\b)
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: entity.name.type.vhdl }
      - match: (?i)\b(?:(pure|impure)\s+)?(function|procedure)\s+(?!is\b)([a-z]\w*)(?:\s+(return)\s+(?:[a-z]\w*\.)*([a-z]\w*))?
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: keyword.reserved.vhdl }
          '3': { name: entity.name.function.vhdl }
          '4': { name: keyword.reserved.vhdl }
          '5': { name: entity.name.type.vhdl }
      # The return type after a parameter list.
      - match: (?i)(?<=\))\s*(return)\s+(?:[a-z]\w*\.)*([a-z]\w*)
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: entity.name.type.vhdl }
      - match: (?i)\b(?:(shared)\s+)?(signal|variable|constant|file)\s+(?!of\b)([a-z]\w*(?:\s*,\s*[a-z]\w*)*)
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: keyword.reserved.vhdl }
          '3':
            patterns:
              - match: (?i)[a-z]\w*
                name: entity.name.variable.vhdl
              - match: ','
                name: keyword.operator.vhdl
      - match: (?i)\b(end)\s+(?:(pure|impure)\s+)?(function|procedure)(?:\s+([a-z]\w*))?\s*(?=;)
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: keyword.reserved.vhdl }
          '3': { name: keyword.reserved.vhdl }
          '4': { name: entity.name.function.vhdl }
      - match: (?i)\b(end)\s+((?:postponed\s+)?process|block|generate|if|case|loop|for)(?:\s*(\?))?(?:\s+([a-z]\w*))?\s*(?=;)
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: keyword.reserved.vhdl }
          '3': { name: keyword.operator.vhdl }
          '4': { name: entity.name.tag.vhdl }
      # `end <unit kind> [name] ;`. A bare `end name;` may close a unit, a
      # subprogram or a statement, so its name stays unscoped.
      - match: (?i)\b(end)\s+(entity|architecture|package\s+body|package|configuration|context|component|record|units|protected\s+body|protected)(?:\s+([a-z]\w*))?\s*(?=;)
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: keyword.reserved.vhdl }
          '3': { name: entity.name.type.vhdl }
      # Statement labels: `lbl : process`, `u1 : entity work.x`, `u1 : comp port map`.
      - match: (?i)^\s*([a-z]\w*)\s*(:)(?!=)(?=\s*(?:(?:postponed|process|block|for|if|case|while|loop|assert|with|entity|component|configuration)\b|[a-z]\w*\s+(?:port|generic)\s+map\b|$))
        captures:
          '1': { name: entity.name.tag.vhdl }
          '2': { name: keyword.operator.vhdl }
      - match: (?i)\b(when|elsif)\s+([a-z]\w*)\s*(:)(?!=)
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: entity.name.tag.vhdl }
          '3': { name: keyword.operator.vhdl }
      # The type mark of an object, port, generic, parameter or element.
      - match: (?i)(:)(?!=)\s*(?:(in|out|inout|buffer|linkage)\s+)?(?!(?:architecture|assert|block|buffer|case|component|configuration|constant|entity|file|for|function|group|if|in|inout|label|linkage|literal|loop|out|package|postponed|procedure|process|signal|subtype|type|units|variable|while|with)\b)((?:[a-z]\w*\.)*)([a-z]\w*)
        captures:
          '1': { name: keyword.operator.vhdl }
          '2': { name: keyword.reserved.vhdl }
          '3': { name: entity.name.section.vhdl }
          '4': { name: entity.name.type.vhdl }
      # Enumeration literals of `type t is (a, b, c);`.
      - begin: (?i)(?<=\bis)\s*(\()
        beginCaptures:
          '1': { name: keyword.operator.vhdl }
        end: (\))\s*(;)
        endCaptures:
          '1': { name: keyword.operator.vhdl }
          '2': { name: keyword.operator.vhdl }
        patterns:
          - include: '#comments'
          - match: (?<![\w)\]])'.'
            name: string.quoted.single.vhdl
          - match: (?i)[a-z]\w*
            name: entity.name.type.vhdl

  associations:
    patterns:
      - match: (?i)\b(when)\s+(?!others\b)([a-z]\w*)\s*(=>)
        captures:
          '1': { name: keyword.reserved.vhdl }
          '2': { name: support.constant.vhdl }
          '3': { name: keyword.operator.vhdl }
      - match: (?i)\b(?!others\b)([a-z]\w*)\s*(=>)
        captures:
          '1': { name: variable.parameter.vhdl }
          '2': { name: keyword.operator.vhdl }

  reserved:
    match: >-
      (?i)\b(?:abs|access|after|alias|all|and|architecture|array|assert|assume|assume_guarantee|attribute|begin|block|body|buffer|bus|case|component|configuration|constant|context|cover|default|disconnect|downto|else|elsif|end|entity|exit|fairness|file|for|force|function|generate|generic|group|guarded|if|impure|in|inertial|inout|is|label|library|linkage|literal|loop|map|mod|nand|new|next|nor|not|null|of|on|open|or|others|out|package|parameter|port|postponed|procedure|process|property|protected|pure|range|record|register|reject|release|rem|report|restrict|restrict_guarantee|return|rol|ror|select|sequence|severity|shared|signal|sla|sll|sra|srl|strong|subtype|then|to|transport|type|unaffected|units|until|use|variable|vmode|vprop|vunit|wait|when|while|with|xnor|xor)\b
    name: keyword.reserved.vhdl

  library:
    # Names from std.standard, std.env, std.textio and the ieee packages.
    patterns:
      - match: >-
          (?i)\b(?:bit|bit_vector|boolean|boolean_vector|character|complex|complex_polar|delay_length|file_open_kind|file_open_status|fixed_overflow_style_type|fixed_round_style_type|float|float128|float32|float64|fphdlsynth_or_real|integer|integer_vector|line|natural|positive|positive_real|principal_value|real|real_vector|round_type|severity_level|sfixed|side|signed|std_logic|std_logic_vector|std_ulogic|std_ulogic_vector|string|text|time|time_vector|u_float|u_float128|u_float32|u_float64|u_sfixed|u_signed|u_ufixed|u_unsigned|ufixed|unresolved_float|unresolved_float128|unresolved_float32|unresolved_float64|unresolved_sfixed|unresolved_signed|unresolved_ufixed|unresolved_unsigned|unsigned|ux01|ux01z|valid_fpstate|width|x01|x01z)\b
        name: entity.name.type.vhdl
      - match: >-
          (?i)\b(?:ack|append_mode|bel|bs|can|cr|dc1|dc2|dc3|dc4|del|dle|em|enq|eot|error|esc|etb|etx|failure|false|ff|fixed_round|fixed_saturate|fixed_truncate|fixed_wrap|fs|fsp|gsp|hr|ht|input|isx|left|lf|math_1_over_e|math_1_over_pi|math_1_over_sqrt_2|math_2_pi|math_3_pi_over_2|math_cbase_1|math_cbase_j|math_czero|math_deg_to_rad|math_e|math_log10_of_e|math_log2_of_e|math_log_of_10|math_log_of_2|math_pi|math_pi_over_2|math_pi_over_3|math_pi_over_4|math_rad_to_deg|math_sqrt_2|math_sqrt_pi|min|mode_error|ms|nak|name_error|nan|neg_denormal|neg_inf|neg_normal|neg_zero|note|ns|nul|open_ok|output|pos_denormal|pos_inf|pos_normal|pos_zero|ps|quiet_nan|read_mode|right|round_inf|round_nearest|round_neginf|round_zero|rsp|sec|si|so|soh|status_error|stx|sub|syn|true|us|usp|vt|warning|write_mode)\b(?!\s*\()
        name: support.constant.vhdl
      - match: >-
          (?i)\b(?:add|add_carry|arccos|arccosh|arcsin|arcsinh|arctan|arctanh|arg|binary_read|binary_write|bitstoreal|bread|break_number|bwrite|cbrt|ceil|cmplx|complex_to_polar|conj|copysign|cos|cosh|divide|dividebyp2|eq|exp|falling_edge|find_leftmost|find_rightmost|finish|finite|floor|foreign|from_binary_string|from_bstring|from_hex_string|from_hstring|from_octal_string|from_ostring|from_string|ge|get_principal_value|gt|hex_read|hex_write|hread|hwrite|is_signed|is_x|isnan|justify|le|log|log10|log2|logb|logic_type_encoding|lt|mac|maximum|minimum|modulo|multiply|nanfp|ne|neg_inffp|neg_zerofp|nextafter|normalize|now|octal_read|octal_write|oread|owrite|polar_to_complex|pos_inffp|qnanfp|read|readline|realmax|realmin|realtobits|reciprocal|remainder|resize|resolution_limit|resolved|rising_edge|rotate_left|rotate_right|round|saturate|scalb|sfix_high|sfix_low|sfixed_high|sfixed_low|shift_left|shift_right|sign|sin|sinh|sqrt|sread|std_match|stop|string_read|string_write|subtract|swrite|synthesis_return|tan|tanh|to_01|to_binary_string|to_bit|to_bit_vector|to_bitvector|to_bstring|to_bv|to_float|to_float128|to_float32|to_float64|to_hex_string|to_hstring|to_integer|to_octal_string|to_ostring|to_real|to_sfix|to_sfixed|to_signed|to_slv|to_std_logic_vector|to_std_ulogic_vector|to_stdlogicvector|to_stdulogic|to_stdulogicvector|to_string|to_sulv|to_ufix|to_ufixed|to_unsigned|to_ux01|to_x01|to_x01z|trunc|ufix_high|ufix_low|ufixed_high|ufixed_low|uniform|unordered|write|writeline|zerofp)\b
        name: support.function.vhdl

  identifiers:
    # Extended identifiers `\like this\` and plain names stay unscoped; this
    # consumes them whole so no rule matches inside one.
    match: (?i)\\(?:\\\\|[^\\])*\\|\b[a-z]\w*
  delimiters:
    match: \?/=|\?<=|\?>=|=>|\*\*|:=|/=|>=|<=|<>|\?\?|\?=|\?<|\?>|<<|>>|[&'()*+,\-./:;<=>`|\[\]?@]
    name: keyword.operator.vhdl

name: Release Linux x64 VSIX

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'package.json version to release, without the leading v'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.12.0'

jobs:
  build-and-verify:
    name: Build and verify release package
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HDLSUPPORT_E2E_DISABLE_GPU: '1'
      HDLSUPPORT_E2E_VSCODE_VERSION: stable
    outputs:
      asset_name: ${{ steps.metadata.outputs.asset_name }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      tag: ${{ steps.metadata.outputs.tag }}
      tag_exists: ${{ steps.metadata.outputs.tag_exists }}
      target_sha: ${{ steps.metadata.outputs.target_sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate release metadata
        id: metadata
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          package_version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').version")
          if [[ "$package_version" != "$lock_version" ]]; then
            echo "package.json ($package_version) and package-lock.json ($lock_version) disagree" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            requested_version="$INPUT_VERSION"
            release_tag="v${requested_version}"
          else
            release_tag="$GITHUB_REF_NAME"
            requested_version="${release_tag#v}"
          fi

          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$requested_version" =~ $semver_pattern ]]; then
            echo "release version is not valid SemVer: $requested_version" >&2
            exit 1
          fi
          if [[ "$requested_version" != "$package_version" ]]; then
            echo "requested version $requested_version does not match package.json $package_version" >&2
            exit 1
          fi
          changelog_prefix="## [${requested_version}] - "
          mapfile -t changelog_lines < <(grep -F "$changelog_prefix" CHANGELOG.md || true)
          if [[ "${#changelog_lines[@]}" -ne 1 ]]; then
            echo "CHANGELOG.md must have exactly one dated section for ${requested_version}" >&2
            exit 1
          fi
          release_date="${changelog_lines[0]#"$changelog_prefix"}"
          normalized_date=$(date -u -d "$release_date" +%F 2>/dev/null || true)
          if [[ ! "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ || "$normalized_date" != "$release_date" ]]; then
            echo "CHANGELOG.md section for ${requested_version} must use a valid YYYY-MM-DD date" >&2
            exit 1
          fi

          git fetch --no-tags origin "$DEFAULT_BRANCH"
          target_sha=$(git rev-parse "${GITHUB_SHA}^{commit}")
          default_sha=$(git rev-parse "origin/${DEFAULT_BRANCH}^{commit}")
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$target_sha" != "$default_sha" ]]; then
              echo "manual releases must run from the current ${DEFAULT_BRANCH} head ($default_sha), not $target_sha" >&2
              exit 1
            fi
          elif ! git merge-base --is-ancestor "$target_sha" "$default_sha"; then
            echo "tag ${release_tag} does not point to a commit on ${DEFAULT_BRANCH}" >&2
            exit 1
          fi

          tag_exists=false
          if git show-ref --verify --quiet "refs/tags/${release_tag}"; then
            tag_target=$(git rev-list -n 1 "$release_tag")
            if [[ "$tag_target" != "$target_sha" ]]; then
              echo "tag ${release_tag} points to $tag_target instead of $target_sha" >&2
              exit 1
            fi
            tag_exists=true
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            is_prerelease="$INPUT_PRERELEASE"
          elif [[ "$requested_version" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi

          asset_name="hdl-support-${requested_version}-linux-x64.vsix"
          {
            echo "asset_name=$asset_name"
            echo "prerelease=$is_prerelease"
            echo "tag=$release_tag"
            echo "tag_exists=$tag_exists"
            echo "target_sha=$target_sha"
            echo "version=$requested_version"
          } >> "$GITHUB_OUTPUT"

      - name: Cache VS Code test downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .vscode-test
          key: release-${{ runner.os }}-${{ runner.arch }}-node22-vscode-stable-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            release-${{ runner.os }}-${{ runner.arch }}-node22-vscode-stable-
            ${{ runner.os }}-${{ runner.arch }}-node22-vscode-stable-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit dependencies before packaging
        run: |
          npm audit signatures
          npm audit --omit=dev --audit-level=low

      - name: Verify generated grammars, snippets, and linter settings
        run: |
          npm run build
          git diff --exit-code -- package.json snippets/*.json syntaxes/*.json

      - name: Run static and unit checks
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit

      - name: Install Linux package and GUI prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils unzip xvfb libgtk-3-0 libnss3 libgbm1 libxss1 libxshmfence1 libdrm2 libx11-xcb1 libxcb-dri3-0
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Build the static Linux x64 VSIX
        run: npm run package:linux-x64

      - name: Verify the real server and packaged archive
        run: |
          REQUIRE_LLG=1 REQUIRE_SOFTBRUSH=1 npm run test:contract
          npm run test:package

      - name: Verify real llg diagnostics in VS Code
        run: xvfb-run -a npm run test:e2e:real-server-host

      - name: Verify real Softbrush diagnostics in VS Code
        env:
          HDLSUPPORT_E2E_DISABLE_GPU: '1'
        run: xvfb-run -a npm run test:e2e:softbrush-host

      - name: Run Playwright workbench tests
        run: xvfb-run -a npm run test:e2e:playwright

      - name: Run VS Code extension-host tests
        run: xvfb-run -a npm run test:e2e:client-host

      - name: Prepare versioned release assets
        shell: bash
        env:
          ASSET_NAME: ${{ steps.metadata.outputs.asset_name }}
        run: |
          cp hdl-support-linux-x64.vsix "$ASSET_NAME"
          sha256sum "$ASSET_NAME" > "${ASSET_NAME}.sha256"
          sha256sum --check "${ASSET_NAME}.sha256"

      - name: Upload verified release assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-release-${{ steps.metadata.outputs.version }}
          path: |
            ${{ steps.metadata.outputs.asset_name }}
            ${{ steps.metadata.outputs.asset_name }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download the verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-release-${{ needs.build-and-verify.outputs.version }}
          path: release-assets

      - name: Verify downloaded assets
        shell: bash
        env:
          ASSET_NAME: ${{ needs.build-and-verify.outputs.asset_name }}
        run: |
          cd release-assets
          sha256sum --check "${ASSET_NAME}.sha256"

      - name: Create the tag and GitHub Release
        id: release
        shell: bash
        env:
          ASSET_NAME: ${{ needs.build-and-verify.outputs.asset_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ needs.build-and-verify.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.build-and-verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-and-verify.outputs.version }}
          TAG_EXISTS: ${{ needs.build-and-verify.outputs.tag_exists }}
          TARGET_SHA: ${{ needs.build-and-verify.outputs.target_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists" >&2
            exit 1
          fi

          args=(
            release create "$RELEASE_TAG"
            "release-assets/${ASSET_NAME}#Linux x64 VSIX"
            "release-assets/${ASSET_NAME}.sha256#SHA-256 checksum"
            --fail-on-no-commits
            --generate-notes
            --title "HDL-Support ${RELEASE_VERSION}"
          )
          if [[ "$TAG_EXISTS" == "true" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$TARGET_SHA")
          fi
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi

          gh "${args[@]}"
          release_url=$(gh release view "$RELEASE_TAG" --json url --jq .url)
          echo "url=$release_url" >> "$GITHUB_OUTPUT"
          echo "Published [$RELEASE_TAG]($release_url)" >> "$GITHUB_STEP_SUMMARY"

name: Continuous integration

# Releases are created by hand in the GitHub web UI. Publishing one runs this
# workflow on the release's tag and, once every other job has passed, attaches
# the VSIXes this same run built and tested. See doc/releasing.md.
on:
  push:
    # Tag pushes are left to the `release` trigger, so a release tag is
    # tested once.
    branches: ['**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

# Release runs are never cancelled by a newer push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  NODE_VERSION: '22.12.0'

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Verify generated grammars, snippets, and linter settings are current
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm run build
          git diff --exit-code -- package.json snippets/*.json syntaxes/*.json

  gui:
    name: GUI (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, vscode: '1.82.3' }
          - { os: ubuntu-latest, vscode: stable }
          - { os: windows-latest, vscode: '1.82.3' }
          - { os: windows-latest, vscode: stable }
          - { os: macos-latest, vscode: '1.82.3' }
          - { os: macos-latest, vscode: stable }
    env:
      HDLSUPPORT_E2E_VSCODE_VERSION: ${{ matrix.vscode }}
      HDLSUPPORT_E2E_DISABLE_GPU: '1'
      HDLSUPPORT_E2E_ARTIFACT_DIR: ci-artifacts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache VS Code test downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .vscode-test
          key: ${{ runner.os }}-${{ runner.arch }}-node22-vscode-${{ matrix.vscode }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node22-vscode-${{ matrix.vscode }}-
            ${{ runner.os }}-${{ runner.arch }}-node22-vscode-
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libxss1 libxshmfence1 libdrm2 libx11-xcb1 libxcb-dri3-0
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
      - run: npm ci
      - run: npm run build
      - name: Prepare GUI diagnostics
        shell: bash
        run: mkdir -p ci-artifacts
      - name: Run Playwright GUI layer
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:e2e:playwright; else npm run test:e2e:playwright; fi
      - name: Run VS Code client-host GUI layer
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:e2e:client-host; else npm run test:e2e:client-host; fi
      - name: Collect GUI diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-artifacts/playwright ci-artifacts/vscode-test ci-artifacts/logs
          cp -a playwright-report/. ci-artifacts/playwright/ 2>/dev/null || true
          cp -a test-results/. ci-artifacts/playwright/ 2>/dev/null || true
          cp -a .vscode-test/. ci-artifacts/vscode-test/ 2>/dev/null || true
      - name: Upload GUI diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-diagnostics-${{ matrix.os }}-${{ matrix.vscode }}
          path: ci-artifacts
          if-no-files-found: error
      - name: Clean GUI downloads and reports
        if: always()
        shell: bash
        run: rm -rf playwright-report test-results ci-artifacts

  real-server-and-package:
    name: Real servers and VSIX (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: windows-latest, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
    env:
      HDLSUPPORT_E2E_DISABLE_GPU: '1'
      HDLSUPPORT_E2E_VSCODE_VERSION: stable
      VSIX: hdl-support-${{ matrix.target }}.vsix
    steps:
      # Each runner builds its own platform's VSIX (servers come from the
      # pinned, checksum-verified GitHub releases) and every real-server
      # suite then runs against the unpacked VSIX, i.e. what users install.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache VS Code test downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .vscode-test
          key: ${{ runner.os }}-${{ runner.arch }}-node22-vscode-stable-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node22-vscode-stable-
      - name: Install Linux package and real-host prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils unzip xvfb libgtk-3-0 libnss3 libgbm1 libxss1 libxshmfence1 libdrm2 libx11-xcb1 libxcb-dri3-0
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
      - run: npm ci
      - run: npm run build
      - name: Build the ${{ matrix.target }} VSIX
        run: npm run package:target -- --target "${{ matrix.target }}"
      - name: Unpack the VSIX as the extension under test
        id: unpack
        shell: bash
        run: |
          dir="$RUNNER_TEMP/hdl-vsix"
          rm -rf "$dir" && mkdir -p "$dir"
          if [ "$RUNNER_OS" = Windows ]; then
            # Windows' bsdtar reads zip archives; Git Bash's GNU tar does not.
            /c/Windows/System32/tar.exe -xf "$VSIX" -C "$dir"
          else
            unzip -q "$VSIX" -d "$dir"
          fi
          test -f "$dir/extension/package.json"
          test -f "$dir/extension/dist/extension.js"
          echo "HDLSUPPORT_E2E_EXTENSION_PATH=$dir/extension" >> "$GITHUB_ENV"
      # The archive contract needs unzip/zipinfo; the release workflow also
      # checks the Windows archives on Linux.
      - name: Verify the packaged archive
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' && runner.os != 'Windows' }}
        env:
          HDLSUPPORT_PACKAGE_TARGET: ${{ matrix.target }}
        run: npm run test:package
      # Run every suite once the VSIX is unpacked, so one CI run reports all
      # failing layers instead of stopping at the first.
      - name: Run raw-stdio contracts against the packaged servers
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        shell: bash
        run: REQUIRE_LLG=1 REQUIRE_SOFTBRUSH=1 npm run test:contract
      - name: Verify real llg diagnostics in VS Code from the VSIX
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:e2e:real-server-host; else npm run test:e2e:real-server-host; fi
      - name: Verify real Softbrush diagnostics in VS Code from the VSIX
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:e2e:softbrush-host; else npm run test:e2e:softbrush-host; fi

      - name: Create package checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "$VSIX"; else shasum -a 256 "$VSIX"; fi > "$VSIX.sha256"
      - name: Upload the verified VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-${{ matrix.target }}
          path: |
            ${{ env.VSIX }}
            ${{ env.VSIX }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Windows runners lack unzip/zipinfo, so their archives get the package
  # contract here on Linux, against the exact VSIX the Windows job tested.
  windows-package-contract:
    name: Package contract (${{ matrix.target }})
    needs: real-server-and-package
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, win32-arm64]
    env:
      HDLSUPPORT_PACKAGE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install package inspection prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils unzip
      # The contract compares packaged servers with the staged release files.
      - name: Stage the ${{ matrix.target }} servers
        run: |
          npm run stage:server -- --target "$HDLSUPPORT_PACKAGE_TARGET"
          npm run stage:softbrush -- --target "$HDLSUPPORT_PACKAGE_TARGET"
      - name: Download the tested VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix-${{ matrix.target }}
      - run: npm run test:package

  release-metadata:
    name: Validate release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Validate release metadata
        id: metadata
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          package_version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').version")
          if [[ "$package_version" != "$lock_version" ]]; then
            echo "package.json ($package_version) and package-lock.json ($lock_version) disagree" >&2
            exit 1
          fi

          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "release tag must be v<version>, not $RELEASE_TAG" >&2
            exit 1
          fi
          requested_version="${RELEASE_TAG#v}"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$requested_version" =~ $semver_pattern ]]; then
            echo "release version is not valid SemVer: $requested_version" >&2
            exit 1
          fi
          if [[ "$requested_version" != "$package_version" ]]; then
            echo "release tag $RELEASE_TAG does not match package.json $package_version" >&2
            exit 1
          fi

          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" "origin/${DEFAULT_BRANCH}"; then
            echo "tag ${RELEASE_TAG} does not point to a commit on ${DEFAULT_BRANCH}" >&2
            exit 1
          fi

          {
            echo "tag=$RELEASE_TAG"
            echo "version=$requested_version"
          } >> "$GITHUB_OUTPUT"
      # Install scripts are not needed to audit and are skipped.
      - run: npm ci --ignore-scripts
      - name: Audit dependencies shipped in the VSIX
        run: |
          npm audit signatures
          npm audit --omit=dev --audit-level=low

  publish:
    name: Attach VSIXes to the release
    needs: [quality, gui, real-server-and-package, windows-package-contract, release-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the tested VSIXes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vsix-*
          merge-multiple: true
          path: tested

      # Release files use the <os>-<arch> names of the Lapligence and
      # Softbrush release archives. Re-running this job replaces them.
      - name: Upload the VSIXes and checksums
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          (cd tested && sha256sum --check *.sha256)
          mkdir release-assets
          files=()
          for entry in 'linux-x64:linux-x86_64:Linux x64' 'linux-arm64:linux-arm64:Linux arm64' \
                       'darwin-arm64:macos-arm64:macOS Apple silicon' 'win32-x64:windows-x86_64:Windows x64' \
                       'win32-arm64:windows-arm64:Windows arm64'; do
            IFS=: read -r target platform label <<< "$entry"
            asset="hdl-support-${RELEASE_VERSION}-${platform}.vsix"
            cp "tested/hdl-support-${target}.vsix" "release-assets/${asset}"
            (cd release-assets && sha256sum "$asset" > "${asset}.sha256" && sha256sum --check "${asset}.sha256")
            files+=("release-assets/${asset}#${label} VSIX" "release-assets/${asset}.sha256#${label} SHA-256 checksum")
          done
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          echo "Attached VSIXes to [$RELEASE_TAG]($(gh release view "$RELEASE_TAG" --json url --jq .url))" >> "$GITHUB_STEP_SUMMARY"
